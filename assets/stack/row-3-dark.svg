<svg xmlns="http://www.w3.org/2000/svg" width="122" height="42" viewBox="0 0 122 42" role="img" aria-label="FRONTEND">
  <title>FRONTEND</title>
  <style>
    .lbl { font: 600 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1.4px; fill: #8b949e; }
    .row { animation: rise .65s cubic-bezier(.2, .7, .2, 1) 260ms both; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .row { animation: none; } }
  </style>
  <g class="row"><rect x="0" y="15" width="6" height="6" fill="#4493f8"/><text class="lbl" x="14" y="22">FRONTEND</text></g>
</svg>
