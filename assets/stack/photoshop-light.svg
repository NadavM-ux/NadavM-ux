<svg xmlns="http://www.w3.org/2000/svg" width="133" height="42" viewBox="0 0 133 42" role="img" aria-label="Photoshop">
  <title>Photoshop</title>
  <!-- Logo from Simple Icons 16.36.0 (CC0-1.0) where available. Trademarks belong to their owners. -->
  <style>
    .t { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .m { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .tile { animation: rise .65s cubic-bezier(.2, .7, .2, 1) 580ms both; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .sheen { animation: sweep 9s linear 2533ms infinite; }
    @keyframes sweep { 0% { transform: translateX(0); } 5.63%, 100% { transform: translateX(325px); } }
    @media (prefers-reduced-motion: reduce) { .tile { animation: none; } .sheen { display: none; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0969da" stop-opacity="0"/>
      <stop offset=".5" stop-color="#0969da" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#0969da" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect x="0" y="2" width="125" height="32" rx="6"/></clipPath>
  </defs>
  <g class="tile">
    <g transform="translate(0 2)">
      <rect x=".5" y=".5" width="124" height="31" rx="5.5" fill="#f6f8fa"/>
      <path d="M6 .5H32V31.5H6A5.5 5.5 0 0 1 .5 26V6A5.5 5.5 0 0 1 6 .5Z" fill="#001E36"/>
      <text class="m" x="16" y="20.6" text-anchor="middle" fill="#31A8FF">Ps</text>
      <text class="t" x="77.7" y="20.6" text-anchor="middle">Photoshop</text>
      <rect x=".5" y=".5" width="124" height="31" rx="5.5" fill="none" stroke="#d0d7de"/>
    </g>
    <g clip-path="url(#c)"><g transform="skewX(-18)"><rect class="sheen" x="-175" y="-4" width="160" height="50" fill="url(#g)"/></g></g>
  </g>
</svg>
